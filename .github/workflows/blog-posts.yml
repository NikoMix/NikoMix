name: 📝 Blog Posts Sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-posts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    name: Inject latest Dev.to posts into README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and inject latest blog posts
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          # Dev.to RSS feed for nikomix — updates the README section between
          # <!-- BLOG-POST-LIST:START --> and <!-- BLOG-POST-LIST:END --> markers.
          feed_list: "https://dev.to/feed/nikomix"
          max_post_count: 5
